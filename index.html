<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <h1>Student Dashboard</h1>
        <div class="inputs">
            <input id="nameInput" placeholder="Name">
            <input id="ageInput" type="number" placeholder="Age">
            <input id="courseInput" placeholder="Course">
        </div>
        <button id="showBtn">Show Students</button>
        <button id="addBtn">Add Student</button>
        <button id="themeBtn">Change Theme</button>
        <div id="students"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
